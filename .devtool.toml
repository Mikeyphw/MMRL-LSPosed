# Standalone S01 Android app. This target does not build MMRL or control root.
# The wrapper is sourced from the reviewed MMRL commit and checked by SHA-256.
[project]
runner = "android"
platform = "android"

[workspace]
default_target = "lsposed_app"

[targets.lsposed_app]
root = "."
runner = "android"
platform = "android"
execution_environment = "auto"

[targets.lsposed_app.jobs.assemble_debug]
runner = "android"
gradle_tasks = [":app:assembleDebug"]
outputs = ["app/build/outputs/apk/debug/app-debug.apk"]
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "debug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd", ci_android_expected_output = "app/build/outputs/apk/debug/app-debug.apk" }

[targets.lsposed_app.jobs.lint_debug]
runner = "android"
gradle_tasks = [":app:lintDebug"]
outputs = []
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "debug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd" }

[targets.lsposed_app.jobs.unit_debug]
runner = "android"
gradle_tasks = [":app:testDebugUnitTest"]
outputs = []
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "debug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd" }

[targets.lsposed_app.workflows]
ci = [
  { id = "apk", ref = "job:assemble_debug", depends_on = [] },
  { id = "lint", ref = "job:lint_debug", depends_on = [] },
  { id = "test", ref = "job:unit_debug", depends_on = [] },
]
