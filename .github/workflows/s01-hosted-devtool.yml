name: S01 Standalone Android hosted Devtool

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: s01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-debug:
    name: Devtool native debug APK + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DEVTOOL_SHA: b164463db51e2cffd12f753043b9e55a08cc43ae
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact app source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run non-Gradle source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s scripts/tests -v

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Validate wrapper and enable hosted dependency cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      - name: Install reviewed Devtool commit in venv
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-src"
          git -C "$RUNNER_TEMP/devtool-src" checkout --detach "$DEVTOOL_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-src" rev-parse HEAD)" = "$DEVTOOL_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-src"

      - name: Review exact source and compile Devtool graph
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/hosted_devtool.py plan \
            --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/s01-evidence/plan.json"

      - name: Execute native debug APK DAG node
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/hosted_devtool.py run --node apk \
            --root "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/s01-inputs" \
            --outputs "$RUNNER_TEMP/s01-outputs"

      - name: Verify signed debug APK, package and immutable node receipt
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/hosted_devtool.py verify \
            --root "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/s01-inputs" \
            --outputs "$RUNNER_TEMP/s01-outputs" \
            --evidence "$RUNNER_TEMP/s01-evidence/verification.json"

      - name: Run independent native lint node
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/hosted_devtool.py run --node lint \
            --root "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/s01-inputs" \
            --outputs "$RUNNER_TEMP/s01-outputs"

      - name: Run independent Vector JVM protocol tests via native Devtool
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/hosted_devtool.py run --node test --root "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/s01-inputs" --outputs "$RUNNER_TEMP/s01-outputs"

      - name: Publish hosted JVM test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-jvm-tests-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      # Secrets are never exposed to pull_request builds. The source-bound
      # Devtool build, native receipt, and independent lint must pass first.
      - name: Sign debug APK with dedicated stable GitHub signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MMRL_DEBUG_KEYSTORE_B64: ${{ secrets.MMRL_DEBUG_KEYSTORE_B64 }}
          MMRL_DEBUG_STORE_PASSWORD: ${{ secrets.MMRL_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/hosted_debug_signing.py \
            --root "$GITHUB_WORKSPACE"

      # S08: build instrumentation and disposable hook lab on the same hosted source.
      # S08 root mutation classes are never executed on GitHub.
      # The S09 emulator job runs only a fixed non-root Compose UI test class.
      - name: Build Android instrumentation + isolated Vector hook lab (hosted only)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest :hook-lab-module:assembleDebug :hook-lab-target:assembleDebug

      - name: Verify packages and sign S08 device test APKs with stable debug certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MMRL_DEBUG_KEYSTORE_B64: ${{ secrets.MMRL_DEBUG_KEYSTORE_B64 }}
          MMRL_DEBUG_STORE_PASSWORD: ${{ secrets.MMRL_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/hosted_s08_lab.py

      - name: Stage ephemeral PR emulator pair (no signing secrets)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_emulator.py stage-pr \
            --out "$RUNNER_TEMP/emulator-pr-pair"

      - name: Publish ephemeral PR emulator APK pair
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-pr-emulator-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-pr-pair/
          if-no-files-found: error
          retention-days: 7

      - name: Publish source-bound S08 AndroidTest and hook-lab APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-s08-lab-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/s08-device-lab/
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified stable-signed debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-signed-debug-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/s01-signed/
          if-no-files-found: error
          retention-days: 14

      - name: Publish ephemeral PR debug APK (not stable-signed)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-pr-debug-ephemeral-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/s01-outputs/node-01/
          if-no-files-found: error
          retention-days: 7

      - name: Publish lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-s01-lint-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

      # R3A_FEDERATION_INDEX_BEGIN
      - name: Publish Devtool federation index beside node verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_federation.py \
            --plan "$RUNNER_TEMP/s01-evidence/plan.json" \
            --verification "$RUNNER_TEMP/s01-evidence/verification.json" \
            --output "$RUNNER_TEMP/s01-evidence/federation-index.json"
      # R3A_FEDERATION_INDEX_END

      # R3C_PORTABLE_CONTRACT_BEGIN
      - name: Generate and independently recheck portable Devtool contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_federation_portable.py generate \
            --directory "$RUNNER_TEMP/s01-evidence"
          python3 scripts/ci_federation_portable.py verify \
            --directory "$RUNNER_TEMP/s01-evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --devtool-sha "b164463db51e2cffd12f753043b9e55a08cc43ae"
      # R3C_PORTABLE_CONTRACT_END

      - name: Publish source/graph verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-s01-evidence-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/s01-evidence/
          if-no-files-found: warn
          retention-days: 14

  emulator-instrumentation:
    name: API 36 non-root Compose AndroidTest (emulator)
    needs: hosted-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download stable-signed main APK (trusted main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmrl-lsposed-signed-debug-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-main

      - name: Download same-run instrumented test pair (trusted main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmrl-lsposed-s08-lab-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-lab

      - name: Download unsigned-release ephemeral PR test pair
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmrl-lsposed-pr-emulator-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-pr-pair

      - name: Verify immutable APK source, hashes and package allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci_emulator.py verify --out "$RUNNER_TEMP/emulator-results"

      - name: Enable KVM on Linux hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run isolated non-root Compose UI instrumentation on Android 16
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/ci_emulator.py run --out "$RUNNER_TEMP/emulator-results"

      - name: Publish API 36 instrumentation evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmrl-lsposed-emulator-api36-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-results/
          if-no-files-found: warn
          retention-days: 14

  attest-signed:
    name: GitHub provenance for stable-signed debug APK
    needs: [hosted-debug, emulator-instrumentation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact signed debug artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmrl-lsposed-signed-debug-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-debug

      # R4A_TRUSTED_DEBUG_BOUNDARY_BEGIN
      - name: Checkout source-pinned debug signing policy and verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download same-run Devtool federation evidence for signer continuity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmrl-lsposed-s01-evidence-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r4a-evidence

      - name: Verify trusted debug signer continuity and reject release claims
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci_release_boundary.py verify \
            --signed "$RUNNER_TEMP/signed-debug" \
            --evidence "$RUNNER_TEMP/r4a-evidence" \
            --policy config/debug-signing.json \
            --source "$GITHUB_SHA" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --devtool-sha b164463db51e2cffd12f753043b9e55a08cc43ae
      # R4A_TRUSTED_DEBUG_BOUNDARY_END

      - name: Authenticate signed debug receipt and exact APK hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/signed-debug" <<'PYVERIFY'
          import hashlib, json, os, pathlib, re, sys
          d = pathlib.Path(sys.argv[1]).resolve()
          apk = d / 'MMRL-LSPosed-debug-signed.apk'
          receipt_file = d / 'signed-debug.json'
          if (d.is_symlink() or apk.is_symlink() or receipt_file.is_symlink()
                  or not apk.is_file() or not receipt_file.is_file()):
              raise SystemExit('SIGNED_RECEIPT_REFUSED: missing/nonregular artifact')
          if receipt_file.stat().st_size > 32768 or apk.stat().st_size > 250_000_000:
              raise SystemExit('SIGNED_RECEIPT_REFUSED: invalid artifact size')
          receipt = json.loads(receipt_file.read_text())
          checks = {
              'schema': 'mmrl-lsposed.hosted-signed-debug.v1',
              'status': 'SIGNED_DEBUG_VERIFIED_NOT_RELEASE',
              'repository': 'Mikeyphw/MMRL-LSPosed',
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'application_id': 'io.github.mikeyphw.mmrl.lsposed.debug',
              'signed_apk': apk.name,
              'debuggable': True,
              'release_qualified': False,
              'device_qualified': False,
          }
          if any(type(receipt.get(k)) is not type(v) or receipt.get(k) != v for k,v in checks.items()):
              raise SystemExit('SIGNED_RECEIPT_REFUSED: source identity mismatch')
          digest = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          if (digest != receipt.get('signed_apk_sha256') or
                  apk.stat().st_size != receipt.get('signed_apk_size') or
                  not re.fullmatch('[0-9a-f]{64}', str(receipt.get('certificate_sha256', '')))):
              raise SystemExit('SIGNED_RECEIPT_REFUSED: signed APK digest/identity mismatch')
          print('SIGNED_DEBUG_RECEIPT_AND_HASH_PASS: '+digest)
          PYVERIFY

      - name: Attest exact signed APK as GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/signed-debug/MMRL-LSPosed-debug-signed.apk

      - name: Download exact S08 instrumentation and disposable lab pair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mmrl-lsposed-s08-lab-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/s08-lab-attestation

      - name: Verify S08 pair receipt before provenance attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/s08-lab-attestation" <<'PYLAB'
          import hashlib, json, os, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          receipt = json.loads((directory/'pair-receipt.json').read_text())
          required = {
              'schema':'mmrl-lsposed.s08.instrumentation-pair.v1',
              'status':'SIGNED_TEST_APKS_NOT_DEVICE_QUALIFIED',
              'repository':'Mikeyphw/MMRL-LSPosed',
              'source_sha':os.environ['GITHUB_SHA'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'device_qualified':False,
              'release_qualified':False,
          }
          if any(type(receipt.get(k)) is not type(v) or receipt.get(k) != v for k,v in required.items()):
              raise SystemExit('S08_PAIR_REFUSED: source/host identity differs')
          packages = {'io.github.mikeyphw.mmrl.lsposed.debug.test',
                      'com.mikeyphw.lsposed.hooklab.module',
                      'com.mikeyphw.lsposed.hooklab.target'}
          if set(receipt['artifacts']) != packages:
              raise SystemExit('S08_PAIR_REFUSED: unexpected test packages')
          for pkg,entry in receipt['artifacts'].items():
              file = directory/entry['file']
              if (file.is_symlink() or not file.is_file() or
                  not file.name.endswith('.apk') or file.stat().st_size != entry['size'] or
                  hashlib.file_digest(file.open('rb'),'sha256').hexdigest() != entry['sha256']):
                  raise SystemExit('S08_PAIR_REFUSED: signed APK differs from receipt')
          print('S08_LAB_RECEIPT_AND_HASH_PASS')
          PYLAB

      - name: Attest exact S08 lab and test APK bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/s08-lab-attestation/*.apk
